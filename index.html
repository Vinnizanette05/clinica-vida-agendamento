<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Clínica Vida+ - Agendamento</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #2c8c84;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        .painel {
            background-color: white;
            width: 70%;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
        }

        button {
            background-color: #2c8c84;
            color: white;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
        }

        button:hover {
            background-color: #216b65;
        }
    </style>
</head>

<body>

    <header>
        <h1>Clínica Vida+</h1>
        <p>Seu bem-estar em primeiro lugar</p>
    </header>

    <div class="painel">

        <h2>Agendamento de Atendimento</h2>

        <p>
            Preencha os dados abaixo para realizar o seu agendamento.
            Escolha o serviço, a data e o horário desejado.
        </p>

        <form>

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" required>
            <br><br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" required>
            <br><br>

            <label for="data">Data do atendimento:</label>
            <input type="date" id="data" name="data" required>
            <br><br>

            <label for="horario">Horário:</label>
            <input type="time" id="horario" name="horario" required>
            <br><br>

            <label for="servico">Serviço desejado:</label>
            <select id="servico" name="servico" required>
                <option value="">Selecione um serviço</option>
                <option value="consulta">Consulta</option>
                <option value="avaliacao">Avaliação</option>
                <option value="retorno">Retorno</option>
            </select>

            <br><br>

            <label for="observacoes">Observações:</label>
            <textarea
                id="observacoes"
                name="observacoes"
                rows="5"
                placeholder="Digite alguma observação, se necessário..."
            ></textarea>

            <br><br>

            <button type="submit">Agendar Atendimento</button>

        </form>

    </div>

</body>

</html>
